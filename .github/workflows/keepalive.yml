name: Keep HuggingFace Spaces Alive

on:
  schedule:
    # Every 4 hours (minute 17 avoids GitHub's busy top-of-hour queue)
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # lets the job re-enable itself so GitHub never disables it for inactivity

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping-spaces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Wake and ping all Spaces
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME || 'Faruna01' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTRA_SPACES: ${{ vars.EXTRA_SPACES }}
          SKIP_SPACES: ${{ vars.SKIP_SPACES }}
        run: python keepalive.py

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow through the API resets that timer, with no commits needed.
      - name: Prevent GitHub from disabling this schedule
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
